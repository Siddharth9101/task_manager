services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=/api/v1
    container_name: task_manager_client
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    container_name: task_manager_server
    env_file:
      - ./.env.prod
    depends_on:
      - database
    command: sh -c "npm run migrate:prod && npm run start"
  database:
    image: postgres:16-alpine
    container_name: task_manager_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_manager_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: task_manager_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data:
